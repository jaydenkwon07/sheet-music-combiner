services:
  - type: web
    name: sheet-music-combiner-backend
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --extra web --frozen
    startCommand: uv run uvicorn web.backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SMC_CORS_ORIGINS
        sync: false
