[project]
name = "sheet-music-combiner"
version = "0.1.0"
description = "Combine numbered sheet-music snippet images into paginated US-Letter PDFs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
